# Reverse-proxy /rag/* to the local RAG service on 127.0.0.1:8100
# This snippet must go INSIDE the existing <VirtualHost *:443> block in
# /etc/httpd/conf.d/litellm.conf, before the catch-all `ProxyPass /`.
#
# Order matters: Apache evaluates ProxyPass directives top-down, so /rag/
# must be declared BEFORE the root `ProxyPass / http://127.0.0.1:4000/`.

    # ----- RAG service (retrieval + OpenAI-compat wrapper) -----
    ProxyPass        /rag/ http://127.0.0.1:8100/rag/ keepalive=On
    ProxyPassReverse /rag/ http://127.0.0.1:8100/rag/
